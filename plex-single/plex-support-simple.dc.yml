version: "3"
services:
  # latest versions as of 02/04/2026
  #   to fix the sabnzbd 403 errors, need to add domain to whitelist in settings
  #       - in sabnzbd [ip]:12730/, under Special tab, update "host_whitelist" and add "sabnzbd"
  #
  # ports:
  #  radarr: 12710
  #  sonarr: 12720
  #  sabnzbd: 12730, 12731
  #  nzbhydra2: 12740
  #
  # versions:
  #  radarr: https://hub.docker.com/r/linuxserver/radarr/tags?page=1&ordering=name&name=version
  #  sonarr: https://hub.docker.com/r/linuxserver/sonarr/tags?page=1&ordering=name&name=version
  #  sabnzbd: https://hub.docker.com/r/linuxserver/sabnzbd/tags?page=1&ordering=name&name=version
  #  nzbhydra2: https://hub.docker.com/r/linuxserver/nzbhydra2/tags?page=1&ordering=last_updated&name=version
  #
  radarr:
    image: linuxserver/radarr:version-6.0.4.10291
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Detroit
      - UMASK_SET=022 #optional
    volumes:
      - /share/CACHEDEV1_DATA/radarr/config:/config
      - /share/CACHEDEV1_DATA/plex/movies:/movies
      - /share/CACHEDEV1_DATA/sabnzbd/downloads:/downloads
    ports:
      - 12710:7878
    depends_on:
      - sabnzbd
      - nzbhydra2
    restart: unless-stopped
  sonarr:
    image: linuxserver/sonarr:version-4.0.16.2944
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Detroit
      - UMASK_SET=022 #optional
    volumes:
      - /share/CACHEDEV1_DATA/sonarr/config:/config
      - /share/CACHEDEV1_DATA/plex/series:/tv
      - /share/CACHEDEV1_DATA/sabnzbd/downloads:/downloads
    ports:
      - 12720:8989
    depends_on:
      - sabnzbd
      - nzbhydra2
    restart: unless-stopped
  sabnzbd:
    image: linuxserver/sabnzbd:version-4.5.5
    container_name: sabnzbd
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Detroit
    volumes:
      - /share/CACHEDEV1_DATA/sabnzbd/config:/config
      - /share/CACHEDEV1_DATA/sabnzbd/downloads:/downloads
      - /share/CACHEDEV1_DATA/sabnzbd/incomplete-downloads:/incomplete-downloads #optional
    ports:
      - 12730:8080
      - 12731:9090
    restart: unless-stopped
  nzbhydra2:
    image: linuxserver/nzbhydra2:version-v8.4.1
    container_name: nzbhydra2
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Detroit
      - ARGS=""
      - DEBUG="no"
    volumes:
      - /share/CACHEDEV1_DATA/nzbhydra2/config:/config
    ports:
      - 12740:5076
    restart: unless-stopped
